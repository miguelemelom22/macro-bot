name: Brief diario

on:
  schedule:
    # Dos intentos. Los cron de GitHub Actions son "best effort" y ocasionalmente
    # se saltan una ejecución, así que el segundo es red de seguridad.
    # El código evita el duplicado: solo el primero que corra envía.
    - cron: '17 11 * * 1-5'   # 7:17am RD
    - cron: '43 11 * * 1-5'   # 7:43am RD
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Enviar aunque ya se haya enviado hoy'
        type: boolean
        default: false

permissions:
  contents: write

# Serializa las ejecuciones: la segunda espera a que termine la primera
concurrency:
  group: brief-diario
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      # ref explícito para poder traer los últimos commits después
      - uses: actions/checkout@v4
        with:
          ref: main

      # CLAVE: checkout descarga el repo tal como estaba al CREARSE la
      # ejecución, no al correr. Sin este pull, el segundo disparo leería un
      # estado.json viejo y enviaría el brief por segunda vez.
      - name: Traer el estado mas reciente
        run: |
          git pull --rebase --autostash origin main || echo "Sin cambios que traer."
          echo "--- estado.json actual ---"
          cat estado.json 2>/dev/null || echo "(todavia no existe)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: python brief_diario.py ${{ inputs.forzar && '--forzar' || '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Guardar registro de envio
        run: |
          if [[ -n $(git status --porcelain estado.json) ]]; then
            git config user.name  "macro-bot"
            git config user.email "bot@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: brief diario enviado"
            git pull --rebase --autostash origin main || true
            git push origin main
          else
            echo "Sin cambios en el estado."
          fi
