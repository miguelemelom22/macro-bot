name: Radar y alertas

on:
  schedule:
    - cron: '23 13,15,17,19,21 * * 1-5'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Saltar el filtro de umbrales y consultar directo'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-alertas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Revisar disparadores
        run: python radar.py ${{ inputs.forzar && '--forzar' || '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Revisar alertas de umbral
        run: python alertas.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado
        run: |
          if [[ -n $(git status --porcelain estado.json) ]]; then
            git config user.name  "macro-bot"
            git config user.email "bot@users.noreply.github.com"
            git add estado.json
            git commit -m "estado: radar"
            git push
          else
            echo "Sin cambios en el estado."
          fi
